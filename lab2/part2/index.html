<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Planet data table</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
   <!-- The title of the webpage -->
    <h1>Planet data table</h1>
  </body>
  <!-- The caption for the chart below & source plus clickable link-->
  <p style="text-align: center;">Data about the planets of our solar system (Planetary facts taken from <a href="https://nssdc.gsfc.nasa.gov/planetary/factsheet/"> NASA'S Planetary Data System - Metric</a>)</p>

  <!-- Layout plan for the columns and rows of the table -->
  <table>
  <colgroup>
  <col span="2" />
  <col class="column-boarder" />
  <col span="9" />
  </colgroup>

  <thead>
    <th>Name</th>
    <th>Mass (10²⁴ kg)</th>
    <th>Diameter (km)</th>
    <th>Density (kg/m³)</th>  
    <th>Gravity (m/s²)</th>
    <th>Length of day (hours)</th>
    <th>Distance from Sun (10⁶ km)</th>
    <th>Mean temperature (°C)</th>
    <th>Number of Moons</th>
    <th>Notes</th>
  </thead>

  
  </table>
</html>
